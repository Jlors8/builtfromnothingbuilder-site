<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuiltFromNothingBuilder</title>
<style>
:root {
  --bg: #f3f4f7; --surface: #ffffff; --ink: #1d2330; --ink-muted: #5b6472;
  --border: #dde1e8; --accent: #35507c;
  --font-display: 'Georgia', serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --surface: #1b1f27; --ink: #e7e9ee; --ink-muted: #949cab;
    --border: #2c3340; --accent: #8fb0dd;
  }
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); padding: 0 16px; padding-block: 60px; margin: 0; line-height: 1.6; }
.sheet { max-width: 560px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 44px clamp(20px, 5vw, 56px); text-align: center; }
h1 { font-family: var(--font-display); font-size: 1.7rem; margin: 0 0 10px; }
p { margin: 0 0 1.4rem; color: var(--ink-muted); }
nav { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
nav a { color: var(--accent); text-decoration: none; font-weight: 600; }
nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="sheet">
  <h1>BuiltFromNothingBuilder</h1>
  <p>AI-generated construction-timelapse videos — watch it get built, start to finish.</p>
  <nav>
    <a href="./terms.html">Terms of Service</a>
    <a href="./privacy.html">Privacy Policy</a>
  </nav>
</div>
</body>
</html>
